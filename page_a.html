<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parinya Chaekkathok | Freelance Web Developer</title>

    <!-- ฟอนต์: Monomaniac One -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#050506" /* สีพื้นหลังดำ */,
              accent: "#22e39a" /* สีเขียวนีออน */,
            },
            fontFamily: {
              display: ['"Monomaniac One"', "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="min-h-screen overflow-x-hidden bg-ink font-display text-white antialiased"
  >
    <div class="flex min-h-screen flex-col">
      <!-- ===================== HEADER ===================== -->
      <header class="relative px-6 pt-7 sm:px-10 lg:px-14">
        <div class="mx-auto max-w-7xl">
          <!-- โลโก้ (จอเล็ก: แสดงแถวบนสุด) -->
          <div class="mb-5 flex justify-center md:hidden">
            <a href="#home"
              ><img src="image/Logo.png" alt="hello" class="h-10 w-auto"
            /></a>
          </div>

          <!-- จอเล็ก: เมนูกับโซเชียลวางคนละแถว (กันล้นขอบ) / จอใหญ่: แถวเดียวกัน -->
          <div
            class="flex flex-col items-center gap-4 sm:flex-row sm:justify-between sm:gap-6"
          >
            <!-- เมนูซ้าย -->
            <nav
              class="flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-[14px] tracking-wide sm:gap-x-8 sm:text-[17px] md:flex-1 md:basis-0 md:justify-start"
            >
              <a
                href="#portfolio"
                class="text-white/90 decoration-2 underline-offset-[7px] transition-colors hover:text-accent hover:underline"
                >Portfolio</a
              >
              <a
                href="#about"
                class="text-white/90 decoration-2 underline-offset-[7px] transition-colors hover:text-accent hover:underline"
                >About Me</a
              >
              <a
                href="#contact"
                class="text-white/90 decoration-2 underline-offset-[7px] transition-colors hover:text-accent hover:underline"
                >Get In Touch</a
              >
            </nav>

            <!-- โลโก้กลาง (จอใหญ่) -->
            <a href="#home" class="hidden md:block">
              <img src="image/Logo.png" alt="hello" class="h-11 w-auto" />
            </a>

            <!-- ไอคอนโซเชียลขวา -->
            <div
              class="flex items-center gap-2.5 sm:gap-3 md:flex-1 md:basis-0 md:justify-end"
            >
              <!-- GitHub -->
              <a
                href="#"
                aria-label="GitHub"
                class="grid h-9 w-9 place-items-center rounded-full bg-white text-black"
              >

                  class="h-[18px] w-[18px]"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"

                </svg>
              </a>
              <!-- Instagram -->
              <a
                href="#"
                aria-label="Instagram"
                class="grid h-9 w-9 place-items-center rounded-full bg-white text-black"
              >
                <svg
                  class="h-[18px] w-[18px]"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path

                  />
                </svg>
              </a>
              <!-- Twitter -->
              <a
                href="#"
                aria-label="Twitter"
                class="grid h-9 w-9 place-items-center rounded-full bg-white text-black"
              >
                <svg
                  class="h-[18px] w-[18px]"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M23.95 4.57a10 10 0 0 1-2.82.77 4.96 4.96 0 0 0 2.16-2.72c-.95.56-2 .96-3.13 1.18a4.92 4.92 0 0 0-8.38 4.48A13.94 13.94 0 0 1 1.64 3.16a4.82 4.82 0 0 0-.67 2.48 4.92 4.92 0 0 0 2.19 4.1 4.9 4.9 0 0 1-2.23-.62v.06a4.92 4.92 0 0 0 3.95 4.83 4.996 4.996 0 0 1-2.21.08 4.94 4.94 0 0 0 4.6 3.42A9.87 9.87 0 0 1 0 19.54a13.94 13.94 0 0 0 7.56 2.21c9.05 0 14-7.5 14-13.99 0-.21 0-.42-.02-.63A9.94 9.94 0 0 0 24 4.59z"
                  />
                </svg>
              </a>
              <!-- LinkedIn -->
              <a
                href="#"
                aria-label="LinkedIn"
                class="grid h-9 w-9 place-items-center rounded-full bg-white text-black"
              >
                <svg
                  class="h-[18px] w-[18px]"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05a3.74 3.74 0 0 1 3.37-1.85c3.6 0 4.27 2.37 4.27 5.46zM5.34 7.43a2.07 2.07 0 1 1 2.06-2.07 2.06 2.06 0 0 1-2.06 2.07m1.78 13.02H3.55V9h3.57zM22.22 0H1.77A1.75 1.75 0 0 0 0 1.73v20.54A1.75 1.75 0 0 0 1.77 24h20.45A1.76 1.76 0 0 0 24 22.27V1.73A1.76 1.76 0 0 0 22.22 0"
                  />
                </svg>
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- ===================== HERO ===================== -->
      <main
        id="home"
        class="flex flex-1 flex-col items-center justify-center px-6 py-12 text-center sm:py-16"
      >
        <h1
          class="text-2xl leading-[1.45] tracking-wide sm:text-4xl md:text-[2.7rem]"
        >
          Parinya Chaekkathok
        </h1>

        <p
          class="mt-3 text-2xl leading-[1.45] tracking-wide text-accent sm:mt-4 sm:text-4xl md:text-[2.7rem]"
        >
          Freelance Web Developer
        </p>

        <p
          class="mt-3 text-2xl leading-[1.45] tracking-wide sm:mt-4 sm:text-4xl md:text-[2.7rem]"
        >
          Based In THAILAND
        </p>

        <!-- รูปโปรไฟล์วงกลม -->
        <div class="mt-10 rounded-full border-2 border-accent p-1.5 sm:mt-12">
          <div
            class="h-48 w-48 overflow-hidden rounded-full bg-black sm:h-56 sm:w-56 md:h-60 md:w-60"
          >
            <img
              src="image/C1.jpg"
              alt="Somrak Sudyodjing"
              class="h-full w-full object-cover object-center"
            />
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
